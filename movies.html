<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Фильмы | MovieGallery</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="sidebar">
        <h1 class="logo">Movie<span>Gallery</span></h1>
        <a href="Заглав1.html" class="menu-item">🏠 Главная</a>
        <a href="movies.html" class="menu-item">🎥 Фильмы</a>
        <a href="genres.html" class="menu-item">📚 Жанры</a>
        <a href="about.html" class="menu-item">📖 О нас</a>
        <div class="account-status" id="account-status">
            <div class="auth-info">Гость</div>
            <button class="button" id="auth-button">Войти / Регистрация</button>
        </div>
        
    </div>

    <main>
        <div class="search-bar">
            <div class="search-container">
                <input type="text" placeholder="Поиск фильма..." id="search-input">
                <div class="search-results" id="search-results"></div>
            </div>
        </div>

        <section class="movies-section">
            <h3>Все фильмы</h3>
            <div class="movies-grid films" id="movies-container"></div>
        </section>

        <div class="pagination">
            <a href="#" class="page-button" id="prev-page-btn">Предыдущая</a>
            <span class="page-info" id="current-page">Страница 1</span>
            <a href="#" class="page-button" id="next-page-btn">Следующая</a>
        </div>
    </main>

    <footer>
        <p>© MovieGallery</p>
    </footer>

    <!-- Модальное окно авторизации -->
    <div class="modal" id="auth-modal">
        <div class="modal-content">
            <div class="modal-header">
                <button class="tab active" id="login-tab">Вход</button>
                <button class="tab" id="register-tab">Регистрация</button>
            </div>
            <div class="modal-body">
                <!-- Форма входа -->
                <form id="login-form" class="auth-form">
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" placeholder="Введите e-mail" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Пароль</label>
                        <div class="password-input">
                            <input type="password" id="password" placeholder="Введите пароль" required>
                            <button type="button" class="toggle-password">Скрыть</button>
                        </div>
                    </div>
                    <div class="form-group remember-me">
                        <input type="checkbox" id="remember">
                        <label for="remember">Запомнить меня</label>
                    </div>
                    <button type="submit" class="button">Войти</button>
                </form>

                <!-- Форма регистрации -->
                <form id="register-form" class="auth-form hidden">
                    <div class="form-group">
                        <label for="reg-username">Никнейм</label>
                        <input type="text" id="reg-username" placeholder="Придумайте никнейм" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-email">E-mail</label>
                        <input type="email" id="reg-email" placeholder="Введите e-mail" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-password">Пароль</label>
                        <div class="password-input">
                            <input type="password" id="reg-password" placeholder="Введите пароль" required>
                            <button type="button" class="toggle-password">Скрыть</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Подтвердите пароль</label>
                        <input type="password" id="confirm-password" placeholder="Введите пароль ещё раз" required>
                    </div>
                    <button type="submit" class="button">Зарегистрироваться</button>
                </form>
            </div>
            <button class="close-modal" id="close-modal">×</button>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const searchInput = document.getElementById('search-input');
            const searchResults = document.getElementById('search-results');
            const moviesContainer = document.getElementById('movies-container');
            const nextPageBtn = document.getElementById('next-page-btn');
            const prevPageBtn = document.getElementById('prev-page-btn');
            const currentPageSpan = document.getElementById('current-page');

            let currentPage = 1;
            const moviesPerPage = 10;

            const allMovies = [
                { title: "Человек-паук", image: "image/spider-man.jpg", link: "films/spiderman.html" },
                { title: "Снафф 102", image: "image/snuff-102(1).jpg", link: "films/snuff102.html" },
                { title: "Самый лучший фильм", image: "image/Постер_фильма_«Самый_лучший_фильм»(1).jpg", link: "films/bestmovie.html" },
                { title: "Один дома", image: "image/OneHome(1).jpg", link: "films/onehome.html" },
                { title: "Большой Стэн", image: "image/Постер_Большой_Стэн(1).jpg", link: "films/bigstan.html" },
                { title: "Оружейный барон", image: "image/LordofWar(1).jpg", link: "films/lordofwar.html" },
                { title: "Дивергент", image: "image/Divergent(1).jpg", link: "films/divergent.html" },
                { title: "Соник в кино", image: "image/Sonic(1).jpg", link: "films/sonic.html" },
                { title: "Карты, деньги, два ствола", image: "image/LockStockandTwoSmokingBarrels.jpg", link: "films/lockstockandtwosmokingbarrels.html" },
                { title: "Кунг-фу панда", image: "image/Kungfupanda(1).jpg", link: "films/kungfupanda.html" },
                { title: "Брат 2", image: "image/Brat2_poster(1).jpg", link: "films/brat2.html" },
                { title: "Джон Уик 4", image: "image/john-wick-4(1).jpg", link: "films/johnwick4.html" },
                { title: "Трансформеры", image: "image/Transform.jpg", link: "films/transformers.html" }
            ];

            function updatePaginationButtons() {
                const maxPage = Math.ceil(allMovies.length / moviesPerPage);
                prevPageBtn.disabled = currentPage === 1;
                nextPageBtn.disabled = currentPage === maxPage;
                currentPageSpan.textContent = `Страница ${currentPage} из ${maxPage}`;
            }

            function displayMovies(page, movies = allMovies) {
                moviesContainer.innerHTML = '';
                const start = (page - 1) * moviesPerPage;
                const end = start + moviesPerPage;
                const moviesToShow = movies.slice(start, end);

                moviesToShow.forEach(movie => {
                    const movieElement = document.createElement('a');
                    movieElement.href = movie.link;

                    const card = document.createElement('div');
                    card.className = 'movie-card';
                    card.dataset.title = movie.title;

                    const img = document.createElement('img');
                    img.src = movie.image;
                    img.alt = movie.title;

                    card.appendChild(img);
                    movieElement.appendChild(card);
                    moviesContainer.appendChild(movieElement);
                });

                updatePaginationButtons();
            }

            function searchMovies(query) {
                searchResults.innerHTML = '';
                if (query.length < 1) {
                    searchResults.style.display = 'none';
                    displayMovies(1);
                    return;
                }

                const results = allMovies.filter(movie =>
                    movie.title.toLowerCase().includes(query.toLowerCase())
                );

                results.forEach(movie => {
                    const resultItem = document.createElement('div');
                    resultItem.className = 'search-result-item';
                    resultItem.textContent = movie.title;
                    resultItem.addEventListener('click', () => {
                        searchInput.value = movie.title;
                        searchResults.style.display = 'none';
                        displayMovies(1, [movie]);
                    });
                    searchResults.appendChild(resultItem);
                });

                searchResults.style.display = results.length ? 'block' : 'none';
            }

            displayMovies(currentPage);

            searchInput.addEventListener('input', (e) => {
                searchMovies(e.target.value.trim());
            });

            nextPageBtn.addEventListener('click', (e) => {
                e.preventDefault();
                const maxPage = Math.ceil(allMovies.length / moviesPerPage);
                if (currentPage < maxPage) {
                    currentPage++;
                    displayMovies(currentPage);
                }
            });

            prevPageBtn.addEventListener('click', (e) => {
                e.preventDefault();
                if (currentPage > 1) {
                    currentPage--;
                    displayMovies(currentPage);
                }
            });
        });
    </script>
</body>
</html>
