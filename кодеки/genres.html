<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Жанры | MovieGallery</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="sidebar">
    <h1 class="logo">Movie<span>Gallery</span></h1>
    <div class="account-status" id="account-status">
      <div class="auth-info">Гость</div>
      <button class="button" id="auth-button">Войти / Регистрация</button>
    </div>
    <a href="Заглав1.html" class="menu-item">🏠 Главная</a>
    <a href="movies.html" class="menu-item">🎥 Фильмы</a>
    <a href="genres.html" class="menu-item">📚 Жанры</a>
    <a href="about.html" class="menu-item">📖 О нас</a>
  </div>

  <main>
    <div class="search-bar">
      <div class="search-container">
        <input type="text" placeholder="Поиск по жанру..." id="genre-search" />
      </div>
    </div>

    <section class="movies-section">
      <h3>Фильмы по жанрам</h3>
      <select id="genre-select" class="button">
        <option value="all">Все жанры</option>
        <option value="боевик">Боевик</option>
        <option value="комедия">Комедия</option>
        <option value="фантастика">Фантастика</option>
        <option value="мультфильм">Мультфильм</option>
        <option value="драма">Драма</option>
        <option value="триллер">Триллер</option>
        <option value="приключения">Приключения</option>
      </select>

      <div class="movies-grid films" id="genre-movies"></div>
    </section>
  </main>

  <footer>
    <p>© MovieGallery</p>
  </footer>

  <!-- Модальное окно авторизации (вставляется из других страниц, как раньше) -->
  <div class="modal" id="auth-modal">
    <!-- Сюда вставляется модалка из главной -->
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const genreSelect = document.getElementById("genre-select");
      const moviesContainer = document.getElementById("genre-movies");
      const genreSearch = document.getElementById("genre-search");

      const movies = [
        { title: "Человек-паук", genre: "фантастика", image: "image/spider-man.jpg", link: "films/spiderman.html" },
        { title: "Снафф 102", genre: "триллер", image: "image/snuff-102(1).jpg", link: "films/snuff102.html" },
        { title: "Самый лучший фильм", genre: "комедия", image: "image/Постер_фильма_«Самый_лучший_фильм»(1).jpg", link: "films/bestmovie.html" },
        { title: "Один дома", genre: "комедия", image: "image/OneHome(1).jpg", link: "films/onehome.html" },
        { title: "Большой Стэн", genre: "комедия", image: "image/Постер_Большой_Стэн(1).jpg", link: "films/bigstan.html" },
        { title: "Оружейный барон", genre: "драма", image: "image/LordofWar(1).jpg", link: "films/lordofwar.html" },
        { title: "Дивергент", genre: "фантастика", image: "image/Divergent(1).jpg", link: "films/divergent.html" },
        { title: "Соник в кино", genre: "мультфильм", image: "image/Sonic(1).jpg", link: "films/sonic.html" },
        { title: "Карты, деньги, два ствола", genre: "боевик", image: "image/LockStockandTwoSmokingBarrels.jpg", link: "films/lockstockandtwosmokingbarrels.html" },
        { title: "Кунг-фу панда", genre: "мультфильм", image: "image/Kungfupanda(1).jpg", link: "films/kungfupanda.html" },
        { title: "Брат 2", genre: "боевик", image: "image/Brat2_poster(1).jpg", link: "films/brat2.html" },
        { title: "Джон Уик 4", genre: "боевик", image: "image/john-wick-4(1).jpg", link: "films/johnwick4.html" },
        { title: "Трансформеры", genre: "фантастика", image: "image/Transform.jpg", link: "films/transformers.html" },
        { title: "Майнкрафт", genre: "приключения", image: "image/minecraft.jpg", link: "films/minecraft.html" }
      ];

      function renderMovies(genre) {
        moviesContainer.innerHTML = "";
        const filtered = genre === "all" ? movies : movies.filter(m => m.genre === genre);
        filtered.forEach(movie => {
          const a = document.createElement("a");
          a.href = movie.link;

          const card = document.createElement("div");
          card.className = "movie-card";
          card.dataset.title = movie.title;

          const img = document.createElement("img");
          img.src = movie.image;
          img.alt = movie.title;

          card.appendChild(img);
          a.appendChild(card);
          moviesContainer.appendChild(a);
        });
      }

      genreSelect.addEventListener("change", () => {
        const genre = genreSelect.value;
        renderMovies(genre);
      });

      genreSearch.addEventListener("input", (e) => {
        const query = e.target.value.toLowerCase();
        const filtered = movies.filter(m => m.genre.includes(query));
        moviesContainer.innerHTML = "";
        filtered.forEach(movie => {
          const a = document.createElement("a");
          a.href = movie.link;

          const card = document.createElement("div");
          card.className = "movie-card";
          card.dataset.title = movie.title;

          const img = document.createElement("img");
          img.src = movie.image;
          img.alt = movie.title;

          card.appendChild(img);
          a.appendChild(card);
          moviesContainer.appendChild(a);
        });
      });

      renderMovies("all");
    });
  </script>
</body>
</html>
